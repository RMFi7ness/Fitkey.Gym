<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FitKey Gym - Tu Progreso en Línea</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        fitOrange: '#FF6600',
                        fitDark: '#121212',
                        fitCard: '#1E1E1E',
                        fitGray: '#2A2A2A'
                    }
                }
            }
        }
    </script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body class="bg-fitDark text-white font-['Montserrat'] min-h-screen flex flex-col items-center justify-between p-4">

    <div class="w-full max-w-md bg-fitCard rounded-2xl shadow-2xl overflow-hidden border border-fitGray my-auto">
        <div class="bg-fitOrange p-6 text-center text-fitDark font-black text-2xl tracking-wider uppercase">
            FitKey <span class="text-white">Gym</span>
        </div>

        <div id="auth-section" class="p-6 space-y-4">
            <h2 id="auth-title" class="text-xl font-bold text-center text-white">Acceso de Socios</h2>
            <p class="text-xs text-center text-gray-400">Escanea tu llavero o ingresa con tu cuenta para ver tu rutina y progreso.</p>
            
            <div class="space-y-3">
                <div>
                    <label class="block text-xs uppercase font-semibold text-gray-400 mb-1">Correo Electrónico</label>
                    <input type="email" id="auth-email" placeholder="tucorreo@email.com" class="w-full p-3 bg-fitGray rounded-xl border border-gray-700 text-white focus:outline-none focus:border-fitOrange">
                </div>
                <div>
                    <label class="block text-xs uppercase font-semibold text-gray-400 mb-1">Contraseña</label>
                    <input type="password" id="auth-password" placeholder="••••••••" class="w-full p-3 bg-fitGray rounded-xl border border-gray-700 text-white focus:outline-none focus:border-fitOrange">
                </div>
            </div>

            <button onclick="handleAuth()" id="auth-btn" class="w-full py-3 bg-fitOrange text-fitDark font-bold rounded-xl uppercase tracking-wider hover:bg-orange-500 transition">Iniciar Sesión</button>
            
            <div class="text-center mt-3">
                <button onclick="toggleAuthMode()" id="auth-toggle-btn" class="text-xs text-fitOrange hover:underline">¿No tienes cuenta? Regístrate aquí</button>
            </div>
            <p id="auth-error" class="text-xs text-red-500 text-center mt-2"></p>
        </div>

        <div id="app-section" class="p-6 space-y-6 hidden">
            <div class="flex justify-between items-center border-b border-gray-800 pb-3">
                <div>
                    <p class="text-xs text-gray-400">Bienvenido,</p>
                    <span id="user-email-display" class="font-bold text-fitOrange text-sm"></span>
                </div>
                <button onclick="logout()" class="text-xs bg-fitGray hover:bg-gray-700 px-3 py-1.5 rounded-lg text-gray-300 transition">Cerrar Sesión</button>
            </div>

            <div id="step-form" class="space-y-4">
                <h3 class="font-bold text-lg text-white">Tus Datos Físicos</h3>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs uppercase font-semibold text-gray-400 mb-1">Nombre</label>
                        <input type="text" id="nombre" class="w-full p-3 bg-fitGray rounded-xl border border-gray-700 text-white focus:outline-none focus:border-fitOrange" placeholder="Tu nombre">
                    </div>
                    <div>
                        <label class="block text-xs uppercase font-semibold text-gray-400 mb-1">Edad</label>
                        <input type="number" id="edad" class="w-full p-3 bg-fitGray rounded-xl border border-gray-700 text-white focus:outline-none focus:border-fitOrange" placeholder="Años">
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs uppercase font-semibold text-gray-400 mb-1">Peso (kg)</label>
                        <input type="number" step="0.1" id="peso" class="w-full p-3 bg-fitGray rounded-xl border border-gray-700 text-white focus:outline-none focus:border-fitOrange" placeholder="Ej: 75">
                    </div>
                    <div>
                        <label class="block text-xs uppercase font-semibold text-gray-400 mb-1">Días / Semana</label>
                        <select id="dias" class="w-full p-3 bg-fitGray rounded-xl border border-gray-700 text-white focus:outline-none focus:border-fitOrange">
                            <option value="3">3 Días</option>
                            <option value="4">4 Días</option>
                            <option value="5">5 Días</option>
                        </select>
                    </div>
                </div>
                <div>
                    <label class="block text-xs uppercase font-semibold text-gray-400 mb-1">Objetivo Principal</label>
                    <select id="objetivo" class="w-full p-3 bg-fitGray rounded-xl border border-gray-700 text-white focus:outline-none focus:border-fitOrange">
                        <option value="Hipertrofia">Ganar Músculo (Hipertrofia)</option>
                        <option value="Definicion">Bajar Grasa (Definición)</option>
                        <option value="Resistencia">Condición Física y Salud</option>
                    </select>
                </div>
                <button onclick="guardarDatosYGenerar()" class="w-full py-3 bg-fitOrange text-fitDark font-bold rounded-xl uppercase tracking-wider hover:bg-orange-500 transition">Generar Rutina</button>
            </div>

            <div id="step-routine" class="space-y-6 hidden">
                <div class="bg-fitGray p-4 rounded-xl border border-gray-700">
                    <h3 class="font-bold text-fitOrange mb-1">Tu Plan Personalizado</h3>
                    <p id="resumen-perfil" class="text-xs text-gray-300 mb-3"></p>
                    <div id="rutina-contenido" class="space-y-2 text-sm text-gray-200"></div>
                </div>

                <div class="bg-fitGray p-4 rounded-xl border border-gray-700 space-y-3">
                    <h3 class="font-bold text-white text-sm">Actualizar Mi Peso Actual</h3>
                    <div class="flex gap-2">
                        <input type="number" step="0.1" id="nuevo-peso" placeholder="Nuevo peso (kg)" class="flex-1 p-2 bg-fitDark rounded-lg border border-gray-700 text-white text-sm">
                        <button onclick="registrarProgreso()" class="bg-fitOrange text-fitDark px-4 py-2 rounded-lg font-bold text-sm hover:bg-orange-500">Guardar</button>
                    </div>
                    <div id="historial-pesos" class="text-xs text-gray-400 space-y-1 mt-2"></div>
                </div>

                <button onclick="mostrarFormulario()" class="w-full py-2 bg-fitGray text-gray-300 rounded-xl text-xs hover:bg-gray-700 transition">Modificar Mis Datos Iniciales</button>
            </div>
        </div>
    </div>

    <footer class="mt-4 text-center text-xs text-gray-500">
        &copy; 2026 FitKey Gym. Sistema NFC Inteligente.
    </footer>

    <script>
        const firebaseConfig = {
            apiKey: "TU_API_KEY",
            authDomain: "TU_AUTH_DOMAIN",
            projectId: "TU_PROJECT_ID",
            storageBucket: "TU_STORAGE_BUCKET",
            messagingSenderId: "TU_MESSAGING_SENDER_ID",
            appId: "TU_APP_ID"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        let isRegistering = false;
        let currentUserUid = null;

        function toggleAuthMode() {
            isRegistering = !isRegistering;
            const title = document.getElementById('auth-title');
            const btn = document.getElementById('auth-btn');
            const toggleBtn = document.getElementById('auth-toggle-btn');

            if (isRegistering) {
                title.innerText = "Registro de Socio";
                btn.innerText = "Registrarse";
                toggleBtn.innerText = "¿Ya tienes cuenta? Inicia sesión";
            } else {
                title.innerText = "Acceso de Socios";
                btn.innerText = "Iniciar Sesión";
                toggleBtn.innerText = "¿No tienes cuenta? Regístrate aquí";
            }
        }

        function handleAuth() {
            const email = document.getElementById('auth-email').value;
            const password = document.getElementById('auth-password').value;
            const errorEl = document.getElementById('auth-error');
            errorEl.innerText = "";

            if (!email || !password) {
                errorEl.innerText = "Completa todos los campos.";
                return;
            }

            if (isRegistering) {
                auth.createUserWithEmailAndPassword(email, password)
                    .catch(err => { errorEl.innerText = err.message; });
            } else {
                auth.signInWithEmailAndPassword(email, password)
                    .catch(err => { errorEl.innerText = err.message; });
            }
        }

        function logout() {
            auth.signOut();
        }

        auth.onAuthStateChanged(user => {
            if (user) {
                currentUserUid = user.uid;
                document.getElementById('user-email-display').innerText = user.email;
                document.getElementById('auth-section').classList.add('hidden');
                document.getElementById('app-section').classList.remove('hidden');
                cargarDatosUsuario();
            } else {
                currentUserUid = null;
                document.getElementById('auth-section').classList.remove('hidden');
                document.getElementById('app-section').classList.add('hidden');
            }
        });

        async function guardarDatosYGenerar() {
            const nombre = document.getElementById('nombre').value;
            const edad = document.getElementById('edad').value;
            const peso = document.getElementById('peso').value;
            const dias = document.getElementById('dias').value;
            const objetivo = document.getElementById('objetivo').value;

            if (!nombre || !edad || !peso) {
                alert("Por favor completa todos los campos.");
                return;
            }

            const datosUsuario = { nombre, edad, peso, dias, objetivo, updatedAt: new Date() };

            try {
                await db.collection('socios').doc(currentUserUid).set(datosUsuario, { merge: true });
                generarRutinaLocal(datosUsuario);
            } catch (e) {
                alert("Error al guardar en la nube: " + e.message);
            }
        }

        async function cargarDatosUsuario() {
            try {
                const doc = await db.collection('socios').doc(currentUserUid).get();
                if (doc.exists) {
                    const data = doc.data();
                    document.getElementById('nombre').value = data.nombre || '';
                    document.getElementById('edad').value = data.edad || '';
                    document.getElementById('peso').value = data.peso || '';
                    document.getElementById('dias').value = data.dias || '3';
                    document.getElementById('objetivo').value = data.objetivo || 'Hipertrofia';

                    if (data.nombre) {
                        generarRutinaLocal(data);
                    }
                }
            } catch (e) {
                console.error("Error cargando datos:", e);
            }
        }

        function generarRutinaLocal(data) {
            document.getElementById('step-form').classList.add('hidden');
            document.getElementById('step-routine').classList.remove('hidden');

            document.getElementById('resumen-perfil').innerText = 
                `${data.nombre} | ${data.edad} años | ${data.peso} kg | Objetivo: ${data.objetivo} (${data.dias} días/sem)`;

            let rutinaHTML = "";
            if (data.dias == "3") {
                rutinaHTML = `
                    <p><strong>Día 1:</strong> Cuerpo Completo (Fuerza)</p>
                    <p><strong>Día 2:</strong> Tren Superior (Pecho/Espalda)</p>
                    <p><strong>Día 3:</strong> Tren Inferior y Core</p>
                `;
            } else if (data.dias == "4") {
                rutinaHTML = `
                    <p><strong>Día 1:</strong> Torso A</p>
                    <p><strong>Día 2:</strong> Pierna A</p>
                    <p><strong>Día 3:</strong> Torso B</p>
                    <p><strong>Día 4:</strong> Pierna B</p>
                `;
            } else {
                rutinaHTML = `
                    <p><strong>Día 1:</strong> Pecho y Tríceps</p>
                    <p><strong>Día 2:</strong> Espalda y Bíceps</p>
                    <p><strong>Día 3:</strong> Pierna Completa</p>
                    <p><strong>Día 4:</strong> Hombros y Abdomen</p>
                    <p><strong>Día 5:</strong> Full Body / Urge</p>
                `;
            }
            document.getElementById('rutina-contenido').innerHTML = rutinaHTML;
            cargarHistorialPesos();
        }

        function mostrarFormulario() {
            document.getElementById('step-routine').classList.add('hidden');
            document.getElementById('step-form').classList.remove('hidden');
        }

        async function registrarProgreso() {
            const nuevoPeso = document.getElementById('nuevo-peso').value;
            if (!nuevoPeso) return;

            const registro = {
                peso: nuevoPeso,
                fecha: new Date().toLocaleDateString()
            };

            try {
                await db.collection('socios').doc(currentUserUid).collection('progreso').add(registro);
                document.getElementById('nuevo-peso').value = '';
                cargarHistorialPesos();
                alert("¡Progreso guardado con éxito!");
            } catch (e) {
                alert("Error al guardar progreso: " + e.message);
            }
        }

        async function cargarHistorialPesos() {
            const historialEl = document.getElementById('historial-pesos');
            historialEl.innerHTML = "Cargando historial...";
            try {
                const snapshot = await db.collection('socios').doc(currentUserUid).collection('progreso').get();
                if (snapshot.empty) {
                    historialEl.innerHTML = "Aún no hay registros de peso guardados.";
                    return;
                }
                let html = "<strong>Historial de peso:</strong><br>";
                snapshot.forEach(doc => {
                    const d = doc.data();
                    html += `- ${d.fecha}: <strong>${d.peso} kg</strong><br>`;
                });
                historialEl.innerHTML = html;
            } catch (e) {
                historialEl.innerHTML = "No se pudo cargar el historial.";
            }
        }
    </script>
</body>
</html>
